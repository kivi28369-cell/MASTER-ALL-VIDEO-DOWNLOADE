name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange flat files into Android folders
        run: |
          for f in $(ls | grep '__'); do
            d=$(echo "$f" | sed 's/__/\//g')
            mkdir -p "$(dirname "$d")"
            cp "$f" "$d"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MASTER ALL VIDEO DOWNLOADER
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
